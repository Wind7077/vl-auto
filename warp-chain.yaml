mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
  fallback:
    - 8.8.4.4

proxy-providers:
  vless-sub:
    type: http
    url: "https://raw.githubusercontent.com/Wind7077/yml-vless/refs/heads/main/vless_normal_vpn.txt"
    interval: 3600
    health-check:
      enable: true
      interval: 300
      url: "https://www.gstatic.com/generate_204"

proxies:
  - name: "warp"
    type: wireguard
    server: 162.159.195.10
    port: 4198
    ip: 172.16.0.2
    ipv6: 2606:4700:110:8172:ca5a:f45d:180d:d977
    private-key: eFzBPxgxWksAAI2S84XV9W3YuG2P+PVZhbdvCzDU42w=
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
    mtu: 1280
    dialer-proxy: "vless-auto"

proxy-groups:
  - name: "vless-auto"
    type: url-test
    use:
      - vless-sub
    url: "https://www.gstatic.com/generate_204"
    interval: 180
    tolerance: 50

  - name: "PROXY"
    type: select
    proxies:
      - warp
      - vless-auto
      - DIRECT

rules:
  - IP-CIDR,162.159.192.0/22,DIRECT,no-resolve
  - IP-CIDR,162.159.195.10/32,DIRECT,no-resolve
  - MATCH,PROXY