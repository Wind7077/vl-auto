name: VLESS Pipeline

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pyyaml

      - run: python merge_vless.py

      - name: debug files
        run: |
          ls -lah
          cat vless_normal_vpn.txt || true
          cat clash_vless.yaml || true

      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add vless_normal_vpn.txt clash_vless.yaml
          git commit -m "update" || exit 0
          git push
