name: vless-auto

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pyyaml

      - run: python merge_vless.py

      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add vless_normal_vpn.txt clash_vless.yaml
          git commit -m "update v4" || exit 0
          git push
