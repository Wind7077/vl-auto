name: VLESS Smart Telegram Filter

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Install sing-box
        run: |
          curl -fsSL https://github.com/SagerNet/sing-box/releases/latest/download/sing-box-1.10.0-linux-amd64.tar.gz -o sb.tar.gz
          tar -xzf sb.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/sing-box

      - name: Run merge
        run: python merge_vless.py

      - name: Run Telegram filter
        run: python telegram_check.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add vless_normal_vpn.txt
          git commit -m "auto telegram filtered update" || exit 0
          git push
